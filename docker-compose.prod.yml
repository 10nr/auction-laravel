version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # NGINX Web Server (Reverse Proxy)
  # ---------------------------------------------------------------------------
  webserver:
    image: nginx:alpine
    container_name: auction_production_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - auction_prod_network
    healthcheck:
      test: ["CMD-SHELL", "wget", "--spider", "-q", "http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Laravel PHP-FPM Application Server
  # ---------------------------------------------------------------------------
  app:
    dns:
     - 8.8.8.8
     - 8.8.4.4
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: auction-laravel:production
    container_name: auction_production_app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: true
      DB_HOST: postgres_db
      REDIS_HOST: redis_cache
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - auction_prod_network
    healthcheck:
      test: ["CMD", "php", "artisan", "env"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Queue Worker for Asynchronous Jobs & Notifications
  # ---------------------------------------------------------------------------
  queue:
    image: auction-laravel:production
    container_name: auction_production_queue
    restart: unless-stopped
    command: php artisan queue:work redis --queue=default,notifications --tries=3 --timeout=90 --sleep=3
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres_db
      REDIS_HOST: redis_cache
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - auction_prod_network

  # ---------------------------------------------------------------------------
  # Task Scheduler (Laravel Cron Jobs)
  # ---------------------------------------------------------------------------
  scheduler:
    image: auction-laravel:production
    container_name: auction_production_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres_db
      REDIS_HOST: redis_cache
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - auction_prod_network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Container
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: auction_production_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-auction_prod}"
      POSTGRES_USER: "${DB_USERNAME:-auction_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret_prod_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auction_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
# ---------------------------------------------------------------------------
  # Redis Cache & Session Store
  # ---------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: auction_production_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - auction_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------
# Persistent Storage Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  bootstrap_cache:
    driver: local

# ---------------------------------------------------------------------------
# Isolated Production Network
# ---------------------------------------------------------------------------
networks:
  auction_prod_network:
    driver: bridge
